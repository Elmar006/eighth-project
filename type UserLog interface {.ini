type UserLog interface {
	SetAge() int
}

type Person struct {
	Name string `json:"name"`
	Age  int    `json:"age"`
}

func (p *Person) SetAge(newAge int) int {
	p.Age = newAge
	fmt.Printf("Изменение возраста пользователя %s на %d\n", p.Name, p.Age)
	return p.Age
}

var AgeCount int

func main() {
	person := Person{Name: "Elmar", Age: 25}
	fmt.Printf("Возраст пользователя %s, до изменений: %d\n", person.Name, person.Age)

	fmt.Println("Введите возраст:")
	fmt.Scanln(&AgeCount)
	 person.SetAge(AgeCount)
	jsonUser, err := json.Marshal(person)
	if err != nil {
		fmt.Printf("Ошибка при сериализации! %v", err)
		return
	}

	fmt.Printf("Возраст пользователя %s, после изменений: %d\n", person.Name, person.Age)
	fmt.Println("JSON:", string(jsonUser))
}




